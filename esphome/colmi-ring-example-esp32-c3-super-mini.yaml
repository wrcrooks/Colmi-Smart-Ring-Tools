# Example ESPHome device for the "ESP32-C3 Super Mini" dev board (the small
# ~18x22mm ESP32-C3 boards common on AliExpress/Amazon, using the espressif
# ESP32-C3 module with a CH340C USB-serial chip). Otherwise identical to
# colmi-ring-example.yaml — see README.md in this directory for setup notes
# and known caveats before flashing.
#
# Board-specific notes:
#   - These boards are known to brown out under BLE radio activity when
#     powered from a weak USB port/cable. If you see random reboots, try a
#     better cable/power source before assuming it's a code problem.
#   - Single-core RISC-V, no classic Bluetooth — fine here since this
#     component only uses BLE.
#   - GPIO8 drives the onboard addressable RGB LED on most of these boards,
#     if you want a status indicator (not configured below).
#
# Find your ring's MAC address by connecting to it once with the webapp
# (../webapp/) — its connection screen shows the address — or with a BLE
# scanner app. Replace the placeholder below.

esphome:
  name: colmi-r06-proxy
  friendly_name: Colmi-R06-Proxy

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
ota:
  platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Needed to set the ring's clock each poll cycle. A local timezone is fine —
# ColmiRing::heart_rate_request_payload_ derives "midnight" from whatever this
# source reports and uses that same value for the CMD_SET_TIME write earlier
# in the same cycle, so the ring's clock and the heart-rate-log request stay
# self-consistent regardless of timezone (see the comment on that method in
# colmi_ring.h).
time:
  - platform: homeassistant
    id: ha_time
    timezone: America/Chicago

esp32_ble_tracker:

ble_client:
  - mac_address: AA:BB:CC:DD:EE:FF
    id: ring_ble_client

external_components:
  - source: github://wrcrooks/Colmi-Smart-Ring-Tools@main
    components: [colmi_ring]
    refresh: 1d

# The hub: owns the BLE connection and polls the ring on update_interval.
# sensor/binary_sensor/text_sensor platform entries below attach to it by id.
colmi_ring:
  - id: my_ring
    ble_client_id: ring_ble_client
    time_id: ha_time
    update_interval: 15min

sensor:
  - platform: colmi_ring
    colmi_ring_id: my_ring
    battery_level:
      name: "Ring battery"
    steps:
      name: "Ring steps today"
    calories:
      name: "Ring calories today"
    distance:
      name: "Ring distance today"
    heart_rate:
      name: "Ring heart rate"
    # Experimental — see docs/PROTOCOL.md. Comment out if you'd rather not
    # expose an unverified estimate.
    sleep_minutes:
      name: "Ring sleep minutes (experimental)"

binary_sensor:
  - platform: colmi_ring
    colmi_ring_id: my_ring
    charging:
      name: "Ring charging"

text_sensor:
  - platform: colmi_ring
    colmi_ring_id: my_ring
    last_sync:
      name: "Ring last sync"
